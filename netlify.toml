# Netlify: sitio de STAGING (se publica desde la rama "staging").
# Netlify detecta Next.js y usa su propia integración para construirlo.
# Variables de entorno (en Netlify: Site configuration > Environment variables):
#   DATABASE_URL     base de staging (Supabase fanbase-staging, Session pooler)
#   FANBASE_API_KEY  clave de la API para staging (distinta de la de producción)
#   DB_POOL_MAX      conexiones a la base por instancia (ej. 2)

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Staging no aparece en buscadores: lo resuelve el propio sitio (robots.txt y
# <meta name="robots">), porque Netlify define NETLIFY=true al construir.
# Ver src/lib/indexacion.ts.
